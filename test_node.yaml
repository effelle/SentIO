# test_node.yaml — SentIO touch test
# Tests: tap, long press, swipe left/right/up/down
# All results printed to serial logger + shown on screen.

esphome:
  name: sentio-test
  friendly_name: SentIO Touch Test

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino
  flash_size: 16MB

external_components:
  - source:
      type: local
      path: components

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# ── Hardware ──────────────────────────────────────────────────────────────────
spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11
  miso_pin: GPIO13

i2c:
  sda: GPIO4
  scl: GPIO8
  scan: true

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO38
    frequency: 1000Hz

light:
  - platform: monochromatic
    id: backlight
    name: "Backlight"
    output: backlight_pwm
    restore_mode: ALWAYS_ON

touchscreen:
  - platform: axs15231
    id: my_touch
    display: my_display
    i2c_id: i2c_bus

display:
  - platform: ili9xxx
    model: ST7796
    id: my_display
    cs_pin: GPIO10
    dc_pin: GPIO14
    reset_pin: GPIO15
    invert_colors: false
    dimensions:
      width: 480
      height: 320
    update_interval: never

# ── LVGL — widgets defined here, no on_boot lambda needed ────────────────────
lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touch
  buffer_size: 25%

  widgets:
    - obj:
        width: 480
        height: 320
        bg_color: 0x0D1117
        border_width: 0
        pad_all: 0
        widgets:

          # Status label — updated by every touch event
          - label:
              id: lbl_status
              x: 20
              y: 12
              text: "Waiting for touch..."
              text_color: 0x8B949E
              text_font: MONTSERRAT_16

          # ── TAP / LONG-PRESS button ───────────────────────────────────────
          - button:
              id: btn_main
              x: 20
              y: 50
              width: 220
              height: 80
              bg_color: 0x21262D
              border_color: 0x30363D
              border_width: 1
              radius: 8
              widgets:
                - label:
                    text: "TAP  or  HOLD ME"
                    text_color: 0xE6EDF0
                    align: CENTER
              on_click:
                - logger.log: ">>> TAP"
                - lvgl.label.update:
                    id: lbl_status
                    text: "TAP ✓"
              on_long_press:
                - logger.log: ">>> LONG PRESS"
                - lvgl.label.update:
                    id: lbl_status
                    text: "LONG PRESS ✓"

          # ── Reset button ──────────────────────────────────────────────────
          - button:
              id: btn_reset
              x: 260
              y: 50
              width: 200
              height: 80
              bg_color: 0x161B22
              border_color: 0x30363D
              border_width: 1
              radius: 8
              widgets:
                - label:
                    text: "RESET"
                    text_color: 0x8B949E
                    align: CENTER
              on_click:
                - lvgl.label.update:
                    id: lbl_status
                    text: "Waiting for touch..."

          # ── Swipe hint label ──────────────────────────────────────────────
          - label:
              x: 20
              y: 155
              text: "Swipe anywhere on screen →"
              text_color: 0x30363D
              text_font: MONTSERRAT_14

# ── SentIO — handles swipes ───────────────────────────────────────────────────
sentio:
  id: my_sentio
  touch_source: my_touch
  backlight_light: backlight
  sleep_timeout: 300s
  suppress_wake_click: true

  on_swipe_left:
    - logger.log: ">>> SWIPE LEFT"
    - lvgl.label.update:
        id: lbl_status
        text: "SWIPE LEFT ✓"

  on_swipe_right:
    - logger.log: ">>> SWIPE RIGHT"
    - lvgl.label.update:
        id: lbl_status
        text: "SWIPE RIGHT ✓"

  on_swipe_up:
    - logger.log: ">>> SWIPE UP"
    - lvgl.label.update:
        id: lbl_status
        text: "SWIPE UP ✓"

  on_swipe_down:
    - logger.log: ">>> SWIPE DOWN"
    - lvgl.label.update:
        id: lbl_status
        text: "SWIPE DOWN ✓"

  on_sleep:
    - logger.log: "Screen sleeping"

  on_wake:
    - logger.log: "Screen woke up"
