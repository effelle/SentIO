# Enable logging
logger:
  level: DEBUG
# Enable Home Assistant API
api:
  custom_services: true
  encryption:
    key: "JqYU9bk4PFLohXWSlBHBQPIFaIh4pPBwuw+8OCAF+Ms="

ota:
  - platform: esphome
    password: "acec772c3b406f01bbc0a2b0be3c829f"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Sentio-Test Fallback Hotspot"
    password: "xqtZv0h62Vby"

captive_portal:

time:
  - platform: homeassistant
    id: homeassistant_time
    timezone: GMT+3
    
switch:
  - platform: restart
    name: "SentIO_Restart"

spi:
  - type: quad
    clk_pin: 47
    data_pins: [21, 48, 40, 39]
    id: spi_bus

i2c:
  sda: GPIO04
  scl: GPIO08
  id: i2c_bus

output:
  - id: backlight_pwm
    platform: ledc
    pin: 1
    frequency: 1000Hz

light:
  - platform: monochromatic
    id: backlight
    name: "Display Backlight"
    output: backlight_pwm
    default_transition_length: 500ms  # Smooth fade-in/fade-out on wake/sleep
    restore_mode: ALWAYS_ON

# ── Touchscreen (AXS15231 — internal so LVGL & SentIO both consume it) ────────
touchscreen:
  - platform: axs15231
    id: my_touch
    display: my_display
    i2c_id: i2c_bus

# ── Display (AXS15231 QSPI — typical for JC3248W535C) ─────────────────────────
display:
  - platform: mipi_spi
    model: JC3248W535
    id: my_display
    spi_id: spi_bus
    data_rate: 40MHz
    update_interval: never
    auto_clear_enabled: false

# display:
#   - platform: ili9xxx
#     model: ST7796
#     id: my_display
#     spi_id: spi_bus
#     cs_pin: GPIO10
#     dc_pin: GPIO14
#     reset_pin: GPIO15
#     invert_colors: false
#     dimensions:
#       width: 480
#       height: 320
#     update_interval: never

# ── LVGL (base — SentIO layers on top of this) ────────────────────────────────
lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touch
  buffer_size: 25%

# ── Local Sensors (to test SentIO local sensor binding) ──────────────────────
sensor:
  - platform: template
    id: my_temp_sensor
    name: "Room Temperature"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      return 23.5;

# ── SentIO overlay ────────────────────────────────────────────────────────────
sentio:
  id: my_sentio
  # Optional: link to the touch driver for smart-touch features.
  # If omitted, SentIO still manages JSONL widgets and backlight.
  touch_source: my_touch

  # Backlight to dim/restore on sleep/wake. Use backlight_light OR backlight_output.
  backlight_light: backlight

  # Dim and black out the screen before the on_sleep trigger fires.
  # Critical for JC3248W535C: prevents the display from glowing via floating SPI.
  display_off_before_sleep: true

  # Idle timeout before sleep (adjust to taste)
  sleep_timeout: 60s

  # First tap after wake does NOT click a widget
  suppress_wake_click: true

  # Shift UI ±1 px every 60 s (good for 24/7 wall panels)
  anti_burn_in: false

  # Load this layout on boot (must be present in LittleFS)
  # startup_layout: /sentio.jsonl

  # Swipe gesture automations (local, connection-independent)
  on_swipe_left:
    - lambda: |-
        my_sentio->service_load_page("page2");
  on_swipe_right:
    - lambda: |-
        my_sentio->service_load_page("page1");

  # Page lifecycle event automations (passes page ID as string 'x')
  on_page_show:
    - logger.log:
        format: "SentIO Page Show: %s"
        args: [ 'x' ]
  on_page_hide:
    - logger.log:
        format: "SentIO Page Hide: %s"
        args: [ 'x' ]

  on_sleep:
    # Option A: just dim — no deep sleep (works on any board)
    - logger.log: "SentIO: screen sleeping"
    # Option B: uncomment for deep sleep (JC3248W535C with deep sleep wired)
    # - deep_sleep.enter:
    #     sleep_duration: 8h

  on_wake:
    - logger.log: "SentIO: screen woke up"
    # Fire a sensor refresh when the user picks up the device
    # - component.update: my_sensor

