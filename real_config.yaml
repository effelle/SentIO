esphome:
  name: sentio-test
  on_boot:
    priority: -100.0  # Runs after setup completes (LATE - 100)
    then:
      - lambda: |-
          // Create page 1 container
          my_sentio->service_run_jsonl("{\"id\":\"page1\",\"obj\":\"container\",\"hidden\":false}");
          my_sentio->service_run_jsonl("{\"id\":\"page1\",\"bg_color\":\"#0D1117\"}");
          
          // Header labels
          my_sentio->service_run_jsonl("{\"id\":\"lbl_title\",\"obj\":\"label\",\"parent\":\"page1\",\"x\":20,\"y\":15,\"text\":\"SentIO Touch & Gesture Test\"}");
          my_sentio->service_run_jsonl("{\"id\":\"lbl_title\",\"text_color\":\"#E6EDF0\"}");
          
          my_sentio->service_run_jsonl("{\"id\":\"lbl_info\",\"obj\":\"label\",\"parent\":\"page1\",\"x\":20,\"y\":45,\"text\":\"Interact & observe serial logs. Swipe to change page.\"}");
          my_sentio->service_run_jsonl("{\"id\":\"lbl_info\",\"text_color\":\"#8B949E\"}");
          
          // Interactive button
          my_sentio->service_run_jsonl("{\"id\":\"btn_press\",\"obj\":\"button\",\"parent\":\"page1\",\"x\":20,\"y\":85,\"w\":180,\"h\":50,\"text\":\"Tap / Hold Me\"}");
          my_sentio->service_run_jsonl("{\"id\":\"btn_press\",\"bg_color\":\"#21262D\"}");
          
          // Slider
          my_sentio->service_run_jsonl("{\"id\":\"lbl_slider\",\"obj\":\"label\",\"parent\":\"page1\",\"x\":220,\"y\":85,\"text\":\"Drag Slider:\"}");
          my_sentio->service_run_jsonl("{\"id\":\"lbl_slider\",\"text_color\":\"#8B949E\"}");
          
          my_sentio->service_run_jsonl("{\"id\":\"sld_test\",\"obj\":\"slider\",\"parent\":\"page1\",\"x\":220,\"y\":110,\"w\":220,\"h\":25,\"min\":0,\"max\":100,\"value\":60}");
          
          // Switch
          my_sentio->service_run_jsonl("{\"id\":\"lbl_sw\",\"obj\":\"label\",\"parent\":\"page1\",\"x\":20,\"y\":165,\"text\":\"Toggle Switch:\"}");
          my_sentio->service_run_jsonl("{\"id\":\"lbl_sw\",\"text_color\":\"#8B949E\"}");
          
          my_sentio->service_run_jsonl("{\"id\":\"sw_test\",\"obj\":\"switch\",\"parent\":\"page1\",\"x\":20,\"y\":190,\"w\":70,\"h\":35,\"checked\":false}");
          
          // Dropdown
          my_sentio->service_run_jsonl("{\"id\":\"lbl_dd\",\"obj\":\"label\",\"parent\":\"page1\",\"x\":150,\"y\":165,\"text\":\"Select Option:\"}");
          my_sentio->service_run_jsonl("{\"id\":\"lbl_dd\",\"text_color\":\"#8B949E\"}");
          
          my_sentio->service_run_jsonl("{\"id\":\"dd_test\",\"obj\":\"dropdown\",\"parent\":\"page1\",\"x\":150,\"y\":190,\"w\":160,\"h\":40,\"options\":\"Option A\\nOption B\\nOption C\"}");
          
          // Sensor-bound label
          my_sentio->service_run_jsonl("{\"id\":\"lbl_sensor\",\"obj\":\"label\",\"parent\":\"page1\",\"x\":330,\"y\":175,\"text\":\"Temp: ---\"}");
          my_sentio->service_run_jsonl("{\"id\":\"lbl_sensor\",\"text_color\":\"#58A6FF\"}");
          my_sentio->service_bind_sensor("lbl_sensor", "my_temp_sensor", "Temp: %.1f °C");
          
          // ── Page 2 Container (initially hidden) ──
          my_sentio->service_run_jsonl("{\"id\":\"page2\",\"obj\":\"container\",\"hidden\":true}");
          my_sentio->service_run_jsonl("{\"id\":\"page2\",\"bg_color\":\"#161B22\"}");
          
          my_sentio->service_run_jsonl("{\"id\":\"lbl_title2\",\"obj\":\"label\",\"parent\":\"page2\",\"x\":20,\"y\":20,\"text\":\"Page 2: Gesture Navigation Work\"}");
          my_sentio->service_run_jsonl("{\"id\":\"lbl_title2\",\"text_color\":\"#58A6FF\"}");
          
          my_sentio->service_run_jsonl("{\"id\":\"lbl_info2\",\"obj\":\"label\",\"parent\":\"page2\",\"x\":20,\"y\":60,\"text\":\"Swipe right to switch back to Page 1.\"}");
          my_sentio->service_run_jsonl("{\"id\":\"lbl_info2\",\"text_color\":\"#8B949E\"}");
