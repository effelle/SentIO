esphome:
  name: sentio-test
  # platformio_options:
  #   upload_speed: 921120
  #   board_build.flash_mode: dio
  #   board_build.f_flash: 80000000L
  #   board_build.f_cpu: 240000000L

esp32:
  board: esp32-s3-devkitc-1
  # variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    # sdkconfig_options:
    #   COMPILER_OPTIMIZATION_SIZE: y
    #   CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
    #   CONFIG_ESP32S3_DATA_CACHE_64KB: y
    #   CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
    #   CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
    #   CONFIG_SPIRAM_RODATA: y

  # Required for display performance and LVGL
psram:
  mode: octal
  speed: 80MHz

external_components:
  - source: github://effelle/SentIO@stage
    components: [ sentio ]
    refresh: always

# Enable logging
logger:
  level: DEBUG
# Enable Home Assistant API
api:
  encryption:
    key: "JqYU9bk4PFLohXWSlBHBQPIFaIh4pPBwuw+8OCAF+Ms="
  homeassistant_services: true
  custom_services: true

ota:
  - platform: esphome
    password: "acec772c3b406f01bbc0a2b0be3c829f"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Sentio-Test Fallback Hotspot"
    password: !secret wifi_password

captive_portal:

time:
  - platform: homeassistant
    id: homeassistant_time
    timezone: GMT+3
    
switch:
  - platform: restart
    name: "SentIO_Restart"

spi:
  - type: quad
    clk_pin: 47
    data_pins: [21, 48, 40, 39]
    id: spi_bus

i2c:
  sda: GPIO04
  scl: GPIO08
  id: i2c_bus

output:
  - id: backlight_pwm
    platform: ledc
    pin: 1
    frequency: 1000Hz

light:
  - platform: monochromatic
    id: backlight
    name: "Display Backlight"
    output: backlight_pwm
    default_transition_length: 500ms  # Smooth fade-in/fade-out on wake/sleep
    restore_mode: ALWAYS_ON

# ── Touchscreen (axs15231 — internal so LVGL & SentIO both consume it) ───────────
touchscreen:
  - id: my_touch
    platform: axs15231
    on_touch:
      - lambda: |-
          ESP_LOGI("touch", "Touch down: x=%d, y=%d", touch.x, touch.y);
    on_release:
      - lambda: |-
          ESP_LOGI("touch", "Touch released");

# ── Display (ST7796 — typical for JC3248W535C) ────────────────────────────────
display:
  - id: my_display
    platform: mipi_spi
    model: JC3248W535
    data_rate: 40MHz
    update_interval: never
    auto_clear_enabled: false
    dimensions:
      width: 320
      height: 480

# ── LVGL (base — SentIO layers on top of this) ────────────────────────────────
lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touch
  buffer_size: 25%

  widgets:
    - obj:
        width: 320
        height: 480
        bg_color: 0x0D1117
        border_width: 0
        pad_all: 0
        widgets:

          # Status label — updated by every touch event
          - label:
              id: lbl_status
              x: 20
              y: 20
              text: "Waiting for touch..."
              text_color: 0x8B949E
              text_font: MONTSERRAT_16

          # ── TAP / LONG-PRESS button ───────────────────────────────────────
          - button:
              id: btn_main
              x: 20
              y: 60
              width: 280
              height: 100
              bg_color: 0x21262D
              border_color: 0x30363D
              border_width: 1
              radius: 8
              widgets:
                - label:
                    text: "TAP  or  HOLD ME"
                    text_color: 0xE6EDF0
                    align: CENTER
              on_click:
                - logger.log: ">>> TAP"
                - lvgl.label.update:
                    id: lbl_status
                    text: "TAP"
              on_long_press:
                - logger.log: ">>> LONG PRESS"
                - lvgl.label.update:
                    id: lbl_status
                    text: "LONG PRESS"

          # ── Reset button ──────────────────────────────────────────────────
          - button:
              id: btn_reset
              x: 20
              y: 180
              width: 280
              height: 100
              bg_color: 0x161B22
              border_color: 0x30363D
              border_width: 1
              radius: 8
              widgets:
                - label:
                    text: "RESET"
                    text_color: 0x8B949E
                    align: CENTER
              on_click:
                - logger.log: ">>> RESET"
                - lvgl.label.update:
                    id: lbl_status
                    text: "Waiting for touch..."

          # ── Swipe hint label ──────────────────────────────────────────────
          - label:
              x: 20
              y: 300
              text: "Swipe anywhere on screen →"
              text_color: 0x30363D
              text_font: MONTSERRAT_14


# ── SD card sensors ───────────────────────────────────────────────────────────
binary_sensor:
  - platform: template
    name: "SD Card Mounted"
    id: sd_card_mounted
    device_class: connectivity
    lambda: |-
      return id(my_sentio).is_sd_mounted();

sensor:
  - platform: template
    name: "SD Card Free Space"
    id: sd_free_space
    unit_of_measurement: "MB"
    icon: "mdi:sd"
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      return id(my_sentio).get_sd_free_mb();

  - platform: template
    name: "SD Card Total Space"
    id: sd_total_space
    unit_of_measurement: "MB"
    icon: "mdi:sd"
    accuracy_decimals: 0
    update_interval: 3600s   # Capacity never changes — poll rarely
    lambda: |-
      return id(my_sentio).get_sd_total_mb();

# ── SentIO — handles swipes ───────────────────────────────────────────────────
sentio:
  id: my_sentio
  touch_source: my_touch
  backlight_light: backlight
  sleep_timeout: 30s
  suppress_wake_click: true
  soft_sleep_only: false
  gesture_threshold: 80    # px min displacement (default 80, tune per screen size)                                
  gesture_timeout: 400ms
  long_press_time: 500ms
  anti_burn_in: true

  sentio_sd:
    # JC3248W535 continuity-test results:
    #   CLK  = GPIO12   CMD/MOSI = GPIO10   D0/MISO = GPIO13
    #   D3/CS = hardwired to GND on PCB → SPI mode forced permanently
    #   D2    = GND (unused in SPI mode)   D1 = unknown / unconnected
    #
    # SPI3_HOST (host 2) is used — display occupies SPI2_HOST via QSPI.
    # GPIO10/12/13 are entirely separate from the display bus (21,39,40,47,48).
    #
    # cs_hardwired: true tells SentIO that D3 is permanently asserted on the
    # PCB. data3_pin is a dummy GPIO the IDF SPI driver must have; GPIO11 is
    # free, not on the silk screen, and not allocated to anything else.
    mode: spi
    spi_host: 2       # SPI3_HOST — separate from the QSPI display (SPI2_HOST)
    clk_pin:    12
    cmd_pin:    10    # MOSI
    data0_pin:  13    # MISO
    data3_pin:  11    # Dummy CS — D3/CS is hardwired to GND on the PCB
    cs_hardwired: true
    format_if_mount_failed: false


  on_swipe_left:
    - logger.log: ">>> SWIPE LEFT"
    - lvgl.label.update:
        id: lbl_status
        text: "SWIPE LEFT"

  on_swipe_right:
    - logger.log: ">>> SWIPE RIGHT"
    - lvgl.label.update:
        id: lbl_status
        text: "SWIPE RIGHT"

  on_swipe_up:
    - logger.log: ">>> SWIPE UP"
    - lvgl.label.update:
        id: lbl_status
        text: "SWIPE UP"

  on_swipe_down:
    - logger.log: ">>> SWIPE DOWN"
    - lvgl.label.update:
        id: lbl_status
        text: "SWIPE DOWN"

  on_sleep:
    - logger.log: "Screen sleeping"

  on_wake:
    - logger.log: "Screen woke up"